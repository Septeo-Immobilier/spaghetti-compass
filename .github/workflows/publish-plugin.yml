name: Publish plugin

# Builds the Claude Code marketplace (skill + MCP server) from main and pushes it
# to the generated `dist` branch. Install with:
#   /plugin marketplace add https://github.com/Septeo-Immobilier/spaghetti-compass.git#dist
#   /plugin install spaghetti-compass@spaghetti-compass

on:
  push:
    branches: [main]
    paths:
      - 'mcp/**'
      - 'skills/**'
      - 'scripts/plugin/**'
      - '.github/workflows/publish-plugin.yml'
  workflow_dispatch:

concurrency:
  group: publish-plugin
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set build directory
        run: echo "BUILD_DIR=$RUNNER_TEMP/plugin-dist" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix mcp

      # The MCP end-to-end tests drive the real CLI, so it must be built first.
      - name: Build CLI
        run: npm run build

      - name: Test MCP server
        run: npm test --prefix mcp

      - name: Test plugin builder
        run: npm run test:plugin

      # Claude Code only offers an update when the plugin `version` changes, so
      # each publish gets a new semver from `plugin-v*` tags and Conventional Commits
      # (the prefix keeps them apart from semantic-release's `v*` npm tags).
      - name: Compute plugin version
        run: |
          VERSION="$(node scripts/plugin/next-version.mjs)"
          echo "PLUGIN_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Plugin version: $VERSION"

      - name: Build marketplace
        run: node scripts/plugin/build.mjs --out "$BUILD_DIR" --version "$PLUGIN_VERSION"

      - name: Validate marketplace
        run: |
          npm install -g @anthropic-ai/claude-code
          claude plugin validate "$BUILD_DIR" --strict

      - name: Publish to dist branch
        run: |
          set -euo pipefail
          SHORT_SHA="${GITHUB_SHA::7}"
          WT="$RUNNER_TEMP/dist-worktree"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git ls-remote --exit-code --heads origin dist >/dev/null 2>&1; then
            git fetch origin dist
            git worktree add -B dist "$WT" origin/dist
          else
            git worktree add --detach "$WT"
            git -C "$WT" checkout --orphan dist
            git -C "$WT" rm -rf --quiet . || true
          fi

          # Replace the worktree content with the build (keep only .git)
          find "$WT" -mindepth 1 -maxdepth 1 ! -name '.git' -exec rm -rf {} +
          cp -a "$BUILD_DIR"/. "$WT"/

          cat > "$WT/README.md" <<'README'
          # dist (generated branch)

          Generated by CI from `main`. Do not edit by hand: any change is overwritten
          on the next publish. Pull requests go to `main`, never to this branch.

          Add the marketplace and install the plugin in Claude Code:

          ```
          /plugin marketplace add https://github.com/Septeo-Immobilier/spaghetti-compass.git#dist
          /plugin install spaghetti-compass@spaghetti-compass
          ```
          README

          git -C "$WT" add -A
          if git -C "$WT" diff --cached --quiet; then
            echo "dist: no change, nothing to publish"
            exit 0
          fi
          git -C "$WT" commit -m "chore(dist): publish plugin v$PLUGIN_VERSION ($SHORT_SHA)"
          git -C "$WT" push origin dist

      # Tag only after a successful publish, so the next run bumps from it.
      - name: Tag release
        run: |
          set -euo pipefail
          TAG="plugin-v$PLUGIN_VERSION"
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "$TAG already exists, nothing to tag"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Plugin $TAG" "$GITHUB_SHA"
          git push origin "refs/tags/$TAG"
