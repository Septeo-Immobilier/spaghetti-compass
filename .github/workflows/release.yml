name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (test without publishing)"
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

jobs:
  release:
    name: Build, Test & Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # 24 for semantic-release 25 (engines: ^22.14.0 || >= 24.10.0) and for the
          # npm >= 11.5.1 that OIDC trusted publishing requires. No registry-url and
          # no NODE_AUTH_TOKEN: an .npmrc auth line would only compete with OIDC.
          node-version: "24"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Run tests
        run: npm run test:run

      - name: Test package locally
        run: |
          echo "🧪 Testing package installation..."
          npm pack
          TARBALL=$(ls *.tgz)
          echo "Created: $TARBALL"

          # Test in isolated directory
          mkdir -p /tmp/test-install
          cp $TARBALL /tmp/test-install/
          cd /tmp/test-install
          npm init -y
          npm install ./$TARBALL

          # Verify CLI works
          echo ""
          echo "✅ Testing CLI..."
          npx spaghetti-compass --version
          echo ""
          echo "✅ Package installs and runs correctly!"

      - name: Verify the integrity of provenance attestations and registry signatures
        run: npm audit signatures

      # semantic-release owns the npm publish (@semantic-release/npm with
      # npmPublish: true), so it runs only when a release is actually warranted.
      #
      # Authentication is OIDC trusted publishing, not a token: the plugin asks
      # GitHub Actions for an id-token scoped to npm:registry.npmjs.org and trades
      # it for a short-lived publish token. That needs the id-token: write
      # permission declared above, plus a trusted publisher registered on npmjs
      # for this repository AND for the workflow filename release.yml.
      # Provenance comes with it — trusted publishing attests by default, which is
      # why no --provenance flag and no NPM_CONFIG_PROVENANCE appear here.
      - name: Semantic Release (Dry Run)
        if: ${{ github.event.inputs.dry_run == 'true' }}
        run: npx semantic-release --dry-run
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Semantic Release
        id: semantic-release
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
