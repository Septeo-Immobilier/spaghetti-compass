name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (test without publishing)"
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

jobs:
  release:
    name: Build, Test & Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Run tests
        run: npm run test:run
        continue-on-error: true

      - name: Test package locally
        run: |
          echo "🧪 Testing package installation..."
          npm pack
          TARBALL=$(ls *.tgz)
          echo "Created: $TARBALL"

          # Test in isolated directory
          mkdir -p /tmp/test-install
          cp $TARBALL /tmp/test-install/
          cd /tmp/test-install
          npm init -y
          npm install ./$TARBALL

          # Verify CLI works
          echo ""
          echo "✅ Testing CLI..."
          npx spaghetti-compass --version
          echo ""
          echo "✅ Package installs and runs correctly!"

      - name: Verify the integrity of provenance attestations and registry signatures
        run: npm audit signatures

      - name: Semantic Release (Dry Run)
        if: ${{ github.event.inputs.dry_run == 'true' }}
        run: npx semantic-release --dry-run
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Semantic Release
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
